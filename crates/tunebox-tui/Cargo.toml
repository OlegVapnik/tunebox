[package]
name = "tunebox-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The terminal interface of tunebox"

# The music services built in. Without any, only the demo runs.
[features]
default = ["spotify", "ytmusic", "soundcloud"]
spotify = ["dep:tunebox-spotify", "dep:tunebox-player", "dep:librespot"]
ytmusic = ["dep:tunebox-ytmusic"]
soundcloud = ["dep:tunebox-soundcloud"]

[dependencies]
tunebox-core.workspace = true
tunebox-spotify = { workspace = true, optional = true }
tunebox-player = { workspace = true, optional = true }
tunebox-ytmusic = { workspace = true, optional = true }
tunebox-soundcloud = { workspace = true, optional = true }
tunebox-os.workspace = true
librespot = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
crossterm.workspace = true
futures.workspace = true
icy_sixel.workspace = true
image.workspace = true
nucleo-matcher.workspace = true
open.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skrifa.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
zeno.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
toml.workspace = true
toml_edit.workspace = true
