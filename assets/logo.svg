<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c9e"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="0.8" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#06b6d4"/>
      <animate attributeName="x2" values="1;1.35;1" dur="4s" repeatCount="indefinite" calcMode="spline"/>
    </linearGradient>
  </defs>
  <text x="40" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="152" font-weight="800" letter-spacing="-4" fill="url(#g)" filter="url(#glow)">tunebox</text>
  <circle cx="140" cy="120" r="18" fill="#06b6d4" filter="url(#glow)"/>
</svg>
